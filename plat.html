<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diamond Rock Estates — Lot Map</title>
<meta name="description" content="Interactive lot map for Diamond Rock Estates — explore each homesite, its acreage, features, and current availability." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#2b2a24;--ink-soft:#5a564a;--line:#3a382f;--paper:#ffffff;--paper-2:#f6f3ec;
    --green:#2d3d2e;--gold:#b8923a;--gold-br:#c9a84c;--stone:#b8a98a;
    --avail:#4e7f52;--under:#c9a84c;--sold:#c0392b;--coming:#8a8372;
    --serif:'Playfair Display',Georgia,serif;--sans:'Inter',-apple-system,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:var(--sans);font-weight:300;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;}
  a{color:inherit;text-decoration:none;}
  h1,h2,h3{font-family:var(--serif);font-weight:400;}

  /* ---- MAP STAGE (fills the frame; no nav, no footer) ---- */
  .stage{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--paper);}
  .map-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;cursor:grab;background:var(--paper);}
  .map-scroll.panning{cursor:grabbing;}
  .map-inner{width:100%;transition:width .25s var(--ease);line-height:0;}
  svg.plat{display:block;width:100%;height:auto;user-select:none;}
  .pimg{opacity:.5;}

  /* parcels */
  .lot{cursor:pointer;stroke:var(--line);stroke-width:1.6;stroke-linejoin:round;transition:fill-opacity .2s var(--ease),stroke-width .2s,stroke .2s;}
  .lot.s-available{fill:var(--avail);fill-opacity:0;}
  .lot.s-under{fill:var(--under);fill-opacity:.16;}
  .lot.s-sold{fill:var(--sold);fill-opacity:.14;}
  .lot.s-coming{fill:var(--coming);fill-opacity:.14;}
  .lot:hover{fill-opacity:.30;stroke:var(--gold);stroke-width:2.6;}
  .lot.dimmed{fill-opacity:0!important;stroke-opacity:.18;}
  .lot.selected{fill-opacity:.34;stroke:var(--gold);stroke-width:3.2;}

  /* number + acreage label (flyer style) */
  .label{pointer-events:none;}
  .label circle{fill:#fff;stroke:var(--line);stroke-width:1.6;}
  .label .num{font-family:var(--sans);font-weight:600;fill:var(--ink);text-anchor:middle;dominant-baseline:central;font-size:19px;}
  .label .ac{font-family:var(--sans);font-weight:400;fill:var(--ink-soft);text-anchor:middle;font-size:13px;letter-spacing:.02em;}
  .label.dimmed{opacity:.2;}
  .label .dotstatus{stroke:#fff;stroke-width:1.5;}
  .st-available .dotstatus{fill:var(--avail);} .st-under .dotstatus{fill:var(--under);}
  .st-sold .dotstatus{fill:var(--sold);} .st-coming .dotstatus{fill:var(--coming);}

  /* SOLD burst */
  .burst{pointer-events:none;}
  .burst polygon{fill:var(--sold);stroke:#fff;stroke-width:1.5;}
  .burst text{fill:#fff;font-family:var(--sans);font-weight:700;font-size:13px;text-anchor:middle;dominant-baseline:central;letter-spacing:.04em;}
  .burst.dimmed{opacity:.2;}

  /* ---- floating controls ---- */
  .ctl{position:absolute;z-index:8;}
  .title{top:16px;left:18px;display:flex;align-items:center;gap:.65rem;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border:1px solid rgba(58,56,47,.14);border-radius:4px;padding:.55rem .85rem;}
  .title .diamond svg{display:block;}
  .title .wm{font-family:var(--sans);font-weight:500;font-size:.72rem;letter-spacing:.26em;text-transform:uppercase;color:var(--green);padding-left:.1em;white-space:nowrap;}
  .title .tg{font-family:var(--serif);font-style:italic;font-size:.78rem;color:var(--ink-soft);margin-left:.1rem;}

  .topright{top:16px;right:18px;display:flex;gap:.5rem;align-items:center;}
  .search{display:flex;align-items:center;gap:.45rem;background:#fff;border:1px solid rgba(58,56,47,.18);border-radius:4px;padding:.5rem .7rem;box-shadow:0 1px 6px rgba(0,0,0,.06);}
  .search svg{opacity:.5;display:block;}
  .search input{border:none;background:transparent;outline:none;font-family:var(--sans);font-size:.85rem;color:var(--ink);width:104px;}
  .search input::placeholder{color:#9a958a;}
  .tbtn{display:inline-flex;align-items:center;gap:.5rem;background:#fff;border:1px solid rgba(58,56,47,.18);color:var(--ink);padding:.5rem .8rem;border-radius:4px;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.06);transition:border-color .3s,background .3s;}
  .tbtn:hover{border-color:var(--gold-br);}
  .tbtn.on{background:var(--gold-br);border-color:var(--gold-br);color:#1a1a16;}

  .legend{left:18px;bottom:18px;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border:1px solid rgba(58,56,47,.16);border-radius:5px;padding:.75rem .5rem;min-width:206px;box-shadow:0 3px 16px rgba(0,0,0,.1);}
  .legend h4{font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft);padding:.1rem .7rem .55rem;font-weight:600;}
  .lrow{display:flex;align-items:center;gap:.65rem;padding:.42rem .7rem;cursor:pointer;border-radius:3px;transition:background .25s var(--ease);}
  .lrow:hover{background:rgba(58,56,47,.05);}
  .lrow .sw{width:14px;height:14px;border-radius:50%;flex:none;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(58,56,47,.3);}
  .lrow .nm{font-size:.76rem;letter-spacing:.04em;color:var(--ink);flex:1;}
  .lrow .ct{font-size:.76rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .lrow[aria-pressed="false"]{opacity:.42;}
  .lrow.avail .sw{background:var(--avail);} .lrow.under .sw{background:var(--under);}
  .lrow.sold .sw{background:var(--sold);} .lrow.coming .sw{background:var(--coming);}

  .zoomctl{right:18px;bottom:18px;display:flex;flex-direction:column;gap:6px;}
  .zoomctl button{width:40px;height:40px;border:1px solid rgba(58,56,47,.18);background:#fff;color:var(--green);font-size:1.3rem;line-height:1;cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 8px rgba(0,0,0,.1);}
  .zoomctl button:hover{border-color:var(--gold-br);}
  .zoomctl button.rst{font-size:.54rem;letter-spacing:.1em;}

  .tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:#fff;border-radius:4px;padding:.45rem .65rem;font-size:.74rem;white-space:nowrap;opacity:0;transform:translateY(4px);transition:opacity .15s ease;box-shadow:0 2px 10px rgba(0,0,0,.2);}
  .tip.show{opacity:1;transform:none;} .tip b{font-weight:600;}

  /* ---- drawer (light) ---- */
  .scrim{position:fixed;inset:0;background:rgba(20,18,14,.4);opacity:0;visibility:hidden;transition:opacity .4s var(--ease),visibility .4s;z-index:40;}
  .scrim.open{opacity:1;visibility:visible;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(410px,92vw);background:var(--paper-2);border-left:1px solid rgba(184,146,58,.4);z-index:50;transform:translateX(100%);transition:transform .5s var(--ease);overflow-y:auto;box-shadow:-10px 0 40px rgba(0,0,0,.14);}
  .drawer.open{transform:none;}
  .drawer-in{padding:clamp(1.8rem,5vw,2.8rem);}
  .drawer .close{position:absolute;top:1.1rem;right:1.1rem;width:36px;height:36px;border:1px solid rgba(58,56,47,.25);background:transparent;color:var(--ink);cursor:pointer;border-radius:50%;font-size:1.1rem;}
  .drawer .close:hover{border-color:var(--gold);color:var(--gold);}
  .d-eyebrow{font-size:.66rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);}
  .d-lotno{font-family:var(--serif);font-size:clamp(2.6rem,8vw,3.4rem);font-weight:500;margin:.35rem 0 .2rem;color:var(--green);}
  .status-pill{display:inline-flex;align-items:center;gap:.5rem;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;padding:.38rem .8rem;border-radius:2px;margin:.3rem 0 1.5rem;}
  .status-pill .dot{width:9px;height:9px;border-radius:50%;}
  .sp-available{background:rgba(78,127,82,.16);color:#3c6340;} .sp-available .dot{background:var(--avail);}
  .sp-under{background:rgba(201,168,76,.2);color:#977516;} .sp-under .dot{background:var(--under);}
  .sp-sold{background:rgba(192,57,43,.14);color:#a32f22;} .sp-sold .dot{background:var(--sold);}
  .sp-coming{background:rgba(138,131,114,.18);color:#6b6456;} .sp-coming .dot{background:var(--coming);}
  .d-facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(58,56,47,.14);border:1px solid rgba(58,56,47,.14);margin-bottom:1.6rem;}
  .d-fact{background:var(--paper-2);padding:1rem 1.1rem;}
  .d-fact .k{font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.3rem;}
  .d-fact .v{font-family:var(--serif);font-size:1.3rem;color:var(--ink);}
  .d-perks{list-style:none;margin:0 0 1.9rem;}
  .d-perks li{display:flex;gap:.75rem;align-items:flex-start;padding:.5rem 0;border-bottom:1px solid rgba(58,56,47,.1);color:var(--ink);font-size:.94rem;}
  .d-perks li::before{content:"";width:8px;height:8px;margin-top:.45rem;flex:none;background:var(--gold);transform:rotate(45deg);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.9rem;font-weight:500;font-size:.72rem;letter-spacing:.26em;text-transform:uppercase;padding:1rem 1.8rem;border:1px solid var(--gold);color:#fff;background:var(--gold);cursor:pointer;width:100%;transition:background .4s,color .4s;}
  .btn:hover{background:transparent;color:var(--gold);}
  .btn.ghost{background:transparent;color:var(--gold);}.btn.ghost:hover{background:var(--gold);color:#fff;}
  .d-note{color:var(--ink-soft);font-size:.78rem;margin-top:.9rem;text-align:center;}
  .d-photos{margin:0 0 1.5rem;}
  .d-photos .main{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;background:#e7dfd0;display:block;}
  .d-photos .thumbs{display:flex;gap:.5rem;margin-top:.5rem;flex-wrap:wrap;}
  .d-photos .thumbs img{width:62px;height:46px;object-fit:cover;border-radius:3px;cursor:pointer;opacity:.65;border:1px solid rgba(58,56,47,.2);transition:opacity .25s,border-color .25s;}
  .d-photos .thumbs img:hover,.d-photos .thumbs img.on{opacity:1;border-color:var(--gold);}
  .label .cam>circle{fill:var(--gold);stroke:#fff;stroke-width:1.2;}

  @media (max-width:680px){
    .title .wm{font-size:.6rem;letter-spacing:.18em;} .title .tg{display:none;}
    .search input{width:76px;} .tbtn .lbl{display:none;} .tbtn{padding:.5rem .55rem;}
    .topright{gap:.4rem;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>

const STATUS={available:{label:"Available"},under:{label:"Under Contract"},sold:{label:"Sold"},coming:{label:"Coming Soon"}};
const SVGNS='http://www.w3.org/2000/svg';
const shapes=document.getElementById('shapes'),labels=document.getElementById('labels'),bursts=document.getElementById('bursts');
const active=new Set(['available','under','sold','coming']);
let selected=null;
const money=n=>n==null?null:'$'+n.toLocaleString('en-US');
const centroid=p=>{let x=0,y=0;p.forEach(q=>{x+=q[0];y+=q[1];});return[x/p.length,y/p.length];};
const acTxt=a=>(a%1===0?a.toFixed(1):a)+' Acres';

function camBadge(cx,cy){var x=cx-12,y=cy-12;return '<g class="cam"><circle cx="'+x+'" cy="'+y+'" r="7"></circle>'+'<rect x="'+(x-3.4)+'" y="'+(y-1.6)+'" width="6.8" height="5" rx="1" fill="none" stroke="#fff" stroke-width="1"></rect>'+'<rect x="'+(x-1.2)+'" y="'+(y-3)+'" width="2.4" height="1.6" fill="#fff" stroke="none"></rect>'+'<circle cx="'+x+'" cy="'+(y+0.9)+'" r="1.5" fill="#fff" stroke="none"></circle></g>';}
function galleryHTML(n){var ph=PHOTOS[String(n)];if(!ph||!ph.length)return "";var thumbs="";if(ph.length>1){thumbs='<div class="thumbs">'+ph.map(function(p,i){return '<img src="'+p+'" class="'+(i===0?"on":"")+'" onclick="swapMain(this,\''+p+'\')" alt="">';}).join("")+'</div>';}return '<div class="d-photos"><img class="main" id="dmain" src="'+ph[0]+'" alt="Lot '+n+' photo">'+thumbs+'</div>';}
function swapMain(el,src){var m=document.getElementById("dmain");if(m)m.src=src;document.querySelectorAll(".d-photos .thumbs img").forEach(function(t){t.classList.remove("on");});el.classList.add("on");}
function starPoints(cx,cy,r1,r2,n){let s='';for(let i=0;i<n*2;i++){const a=Math.PI*i/n-Math.PI/2;const r=i%2?r2:r1;s+=(cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1)+' ';}return s.trim();}

Object.values(LOTS).forEach(lot=>{
  if(!lot.poly||lot.poly.length<3) return;
  const poly=document.createElementNS(SVGNS,'polygon');
  poly.setAttribute('points',lot.poly.map(p=>p.join(',')).join(' '));
  poly.setAttribute('class','lot s-'+lot.status);
  poly.dataset.n=lot.n; poly.dataset.st=lot.status;
  shapes.appendChild(poly);

  const [cx,cy]=centroid(lot.poly);
  const g=document.createElementNS(SVGNS,'g');
  g.setAttribute('class','label st-'+lot.status); g.dataset.n=lot.n; g.dataset.st=lot.status;
  g.innerHTML='<circle cx="'+cx+'" cy="'+cy+'" r="24" fill="#fff" fill-opacity=".82" stroke="none"></circle>'+'<rect x="'+(cx-34)+'" y="'+(cy+18)+'" width="68" height="20" fill="#fff" fill-opacity=".78" stroke="none"></rect>'+'<circle cx="'+cx+'" cy="'+cy+'" r="16"></circle>'+
    '<circle class="dotstatus" cx="'+(cx+12)+'" cy="'+(cy-12)+'" r="4.5"></circle>'+
    '<text class="num" x="'+cx+'" y="'+cy+'">'+lot.n+'</text>'+
    '<text class="ac" x="'+cx+'" y="'+(cy+28)+'">'+acTxt(lot.acres)+'</text>'+(PHOTOS[String(lot.n)]?camBadge(cx,cy):'');
  labels.appendChild(g);

  if(lot.status==='sold'){
    const b=document.createElementNS(SVGNS,'g');
    b.setAttribute('class','burst'); b.dataset.n=lot.n; b.dataset.st='sold';
    const bx=cx, by=cy-40;
    b.innerHTML='<polygon points="'+starPoints(bx,by,22,15,12)+'"></polygon><text x="'+bx+'" y="'+by+'">SOLD</text>';
    bursts.appendChild(b);
  }

  [poly,g].forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();openLot(lot.n);});
    el.addEventListener('mouseenter',e=>showTip(e,lot));
    el.addEventListener('mousemove',moveTip); el.addEventListener('mouseleave',hideTip);
  });
});

function refreshCounts(){const c={available:0,under:0,sold:0,coming:0};Object.values(LOTS).forEach(l=>c[l.status]++);for(const k in c)document.getElementById('ct-'+k).textContent=c[k];}
refreshCounts();
function applyFilter(){document.querySelectorAll('.lot,.label,.burst').forEach(el=>el.classList.toggle('dimmed',!active.has(el.dataset.st)));}
document.querySelectorAll('.lrow').forEach(r=>r.addEventListener('click',()=>{const st=r.dataset.st,on=r.getAttribute('aria-pressed')==='true';r.setAttribute('aria-pressed',(!on).toString());if(on)active.delete(st);else active.add(st);applyFilter();}));

const tip=document.createElement('div');tip.className='tip';document.body.appendChild(tip);

function moveTip(e){tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';}
function hideTip(){tip.classList.remove('show');}

    '<div class="d-fact"><div class="k">Access</div><div class="v" style="font-size:.98rem">'+lot.street+'</div></div>'+
    '<div class="d-fact"><div class="k">Status</div><div class="v" style="font-size:.98rem">'+S.label+'</div></div></div>'+
    '<ul class="d-perks">'+perks+'</ul>'+cta+'<p class="d-note">Reference Lot '+n+' when you reach out.</p>';
  scrim.classList.add('open');drawer.classList.add('open');drawer.setAttribute('aria-hidden','false');
}
function closeDrawer(){scrim.classList.remove('open');drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');if(selected){selected.classList.remove('selected');selected=null;}}
document.getElementById('dclose').addEventListener('click',closeDrawer);
scrim.addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});

const search=document.getElementById('search');
function doSearch(){const n=parseInt(search.value,10);if(LOTS[String(n)])openLot(n);}
search.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
search.addEventListener('input',()=>{if(search.value.length>=2&&LOTS[String(parseInt(search.value,10))])doSearch();});

const legend=document.getElementById('legend'),legendBtn=document.getElementById('legendBtn');
legendBtn.addEventListener('click',()=>{const vis=legend.style.display!=='none';legend.style.display=vis?'none':'block';legendBtn.classList.toggle('on',!vis);legendBtn.setAttribute('aria-pressed',(!vis).toString());});
const stage=document.querySelector('.stage'),fsBtn=document.getElementById('fsBtn');
fsBtn.addEventListener('click',()=>{if(!document.fullscreenElement){(document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen());}else{document.exitFullscreen();}});

const scroll=document.getElementById('scroll'),inner=document.getElementById('inner');
let zoom=1;const MIN=1,MAX=5;
function applyZoom(center){const pW=inner.offsetWidth,pL=scroll.scrollLeft,pT=scroll.scrollTop,cx=pL+scroll.clientWidth/2,cy=pT+scroll.clientHeight/2;inner.style.width=(zoom*100)+'%';if(center)requestAnimationFrame(()=>{const r=inner.offsetWidth/pW;scroll.scrollLeft=cx*r-scroll.clientWidth/2;scroll.scrollTop=cy*r-scroll.clientHeight/2;});}
function fit(){zoom=window.innerWidth<820?1.8:1;applyZoom(false);}
document.getElementById('zin').onclick=()=>{zoom=Math.min(MAX,+(zoom+0.5).toFixed(2));applyZoom(true);};
document.getElementById('zout').onclick=()=>{zoom=Math.max(MIN,+(zoom-0.5).toFixed(2));applyZoom(true);};
document.getElementById('zrst').onclick=()=>{fit();scroll.scrollTo({left:0,top:0});};
fit();
let dragging=false,sx,sy,sl,st2;
scroll.addEventListener('pointerdown',e=>{if(e.target.closest('.lot')||e.target.closest('.label')||e.target.closest('.burst'))return;dragging=true;sx=e.clientX;sy=e.clientY;sl=scroll.scrollLeft;st2=scroll.scrollTop;scroll.classList.add('panning');scroll.setPointerCapture(e.pointerId);});
scroll.addEventListener('pointermove',e=>{if(!dragging)return;scroll.scrollLeft=sl-(e.clientX-sx);scroll.scrollTop=st2-(e.clientY-sy);});
function endDrag(){dragging=false;scroll.classList.remove('panning');}
scroll.addEventListener('pointerup',endDrag);scroll.addEventListener('pointercancel',endDrag);
scroll.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();zoom=Math.min(MAX,Math.max(MIN,+(zoom-(e.deltaY>0?0.3:-0.3)).toFixed(2)));applyZoom(true);},{passive:false});
</script>
</body>
</html>
